# Portable Codex configuration example. Merge into your own config as needed.
[features]
multi_agent = true

[agents]
enabled = true
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "high"

# Keep unrelated settings in your existing config; this example intentionally
# contains no user, machine, account, or credential-specific values.
